{% load static %}
{# Shared left branding half for login/register split-screen auth #}
<div class="auth-left" aria-hidden="true">
    <!-- Fluid blobs -->
    <div class="auth-blob auth-blob--pink"></div>
    <div class="auth-blob auth-blob--cyan"></div>
    <div class="auth-blob auth-blob--purple"></div>

    <!-- Soft wave shapes -->
    <svg class="auth-waves" viewBox="0 0 1440 320" preserveAspectRatio="none">
        <path fill="#22D3EE" d="M0,224L60,213.3C120,203,240,181,360,186.7C480,192,600,224,720,240C840,256,960,256,1080,229.3C1200,203,1320,149,1380,122.7L1440,96L1440,320L0,320Z"></path>
        <path fill="#EC4899" fill-opacity="0.6" d="M0,256L60,245.3C120,235,240,213,360,213.3C480,213,600,235,720,224C840,213,960,171,1080,154.7C1200,139,1320,149,1380,154.7L1440,160L1440,320L0,320Z"></path>
    </svg>

    <!-- Floating cubes & spheres -->
    <div class="auth-float auth-float--1"><div class="auth-cube"></div></div>
    <div class="auth-float auth-float--2"><div class="auth-cube"></div></div>
    <div class="auth-float auth-float--3"><div class="auth-cube"></div></div>
    <div class="auth-float auth-float--4"><div class="auth-cube"></div></div>
    <div class="auth-sphere auth-sphere--1"></div>
    <div class="auth-sphere auth-sphere--2"></div>

    <!-- Atom illustration -->
    <div class="atom">
        <div class="atom__glow"></div>
        <div class="atom__nucleus"></div>
        <div class="atom__ring">
            <div class="atom__circle"></div>
            <div class="atom__electron"></div>
        </div>
        <div class="atom__ring atom__ring--reverse">
            <div class="atom__circle"></div>
            <div class="atom__electron"></div>
        </div>
        <div class="atom__ring atom__ring--inner">
            <div class="atom__circle"></div>
            <div class="atom__electron"></div>
        </div>
    </div>

    <!-- Logo -->
    <div class="auth-logo">
        <div class="auth-logo__icon"><i class="fas fa-brain"></i></div>
        <div class="auth-logo__text">
            <strong>AI Resume Screening</strong>
            <span>System</span>
        </div>
    </div>

    <!-- Headline -->
    <div class="auth-headline">
        <h1>Screen Smarter.<br>Hire Faster.</h1>
        <p>AI-powered resume screening for recruiters — fast, accurate, and effortless.</p>
    </div>
</div>
