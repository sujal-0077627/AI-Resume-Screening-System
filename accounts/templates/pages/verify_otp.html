{% extends "base.html" %}

{% block content %}
<h2>Verify OTP</h2>
<form method="POST">
  {% csrf_token %}
  <div>
    <label>Email:</label>
    <input type="email" name="email" required>
  </div>
  <div>
    <label>OTP:</label>
    <input type="text" name="otp" required>
  </div>
  <button type="submit">Verify</button>
</form>
{% endblock %}
