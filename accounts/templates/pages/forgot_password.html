<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh; display: flex; justify-content: center; align-items: center;
            padding: 30px 20px; overflow: hidden; position: relative;
        }

        .particles { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
        .particle { position: absolute; width: 4px; height: 4px; background: rgba(0, 212, 255, 0.3); border-radius: 50%; animation: float 15s infinite linear; }
        .particle:nth-child(1) { left: 10%; animation-delay: 0s; animation-duration: 12s; }
        .particle:nth-child(2) { left: 25%; animation-delay: 2s; animation-duration: 18s; width: 6px; height: 6px; }
        .particle:nth-child(3) { left: 40%; animation-delay: 4s; animation-duration: 14s; }
        .particle:nth-child(4) { left: 55%; animation-delay: 1s; animation-duration: 20s; width: 3px; height: 3px; }
        .particle:nth-child(5) { left: 70%; animation-delay: 3s; animation-duration: 16s; }
        .particle:nth-child(6) { left: 85%; animation-delay: 5s; animation-duration: 13s; width: 5px; height: 5px; }
        @keyframes float { 0% { bottom: -10px; opacity: 0; transform: translateX(0); } 10% { opacity: 1; } 90% { opacity: 1; } 100% { bottom: 110%; opacity: 0; transform: translateX(20px); } }

        .orb { position: absolute; border-radius: 50%; filter: blur(60px); z-index: 0; animation: pulse 4s infinite ease-in-out; }
        .orb-1 { width: 300px; height: 300px; background: rgba(0, 212, 255, 0.08); top: -100px; left: -100px; }
        .orb-2 { width: 250px; height: 250px; background: rgba(118, 75, 162, 0.1); bottom: -80px; right: -80px; animation-delay: 2s; }
        @keyframes pulse { 0%, 100% { transform: scale(1); opacity: 0.5; } 50% { transform: scale(1.2); opacity: 0.8; } }

        @keyframes fadeInScale { from { opacity: 0; transform: scale(0.9) translateY(20px); } to { opacity: 1; transform: scale(1) translateY(0); } }
        @keyframes slideInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes shimmerText { 0%, 100% { text-shadow: 0 0 15px rgba(0, 212, 255, 0.3); } 50% { text-shadow: 0 0 30px rgba(0, 212, 255, 0.6); } }

        .card {
            position: relative; z-index: 1; width: 450px;
            background: rgba(255, 255, 255, 0.07); backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 20px;
            padding: 40px; box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            animation: fadeInScale 0.6s ease-out;
        }

        .card h1 {
            color: #00d4ff; font-size: 24px; margin-bottom: 10px; text-align: center;
            animation: shimmerText 3s infinite ease-in-out;
        }
        .card .subtitle { color: #a0a0b0; font-size: 14px; margin-bottom: 25px; text-align: center; animation: slideInUp 0.5s ease-out 0.1s both; }

        .input-box { position: relative; width: 100%; margin-bottom: 16px; animation: slideInUp 0.5s ease-out both; }
        .input-box:nth-child(1) { animation-delay: 0.2s; }
        .input-box:nth-child(2) { animation-delay: 0.3s; }
        .input-box:nth-child(3) { animation-delay: 0.4s; }

        .input-box input {
            width: 100%; padding: 13px 16px; padding-right: 42px;
            background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px; font-size: 14px; color: #fff; outline: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .input-box input::placeholder { color: #606070; transition: all 0.3s; }
        .input-box input:focus {
            border-color: #00d4ff; background: rgba(0, 212, 255, 0.08);
            box-shadow: 0 0 0 3px rgba(0, 212, 255, 0.15), 0 0 25px rgba(0, 212, 255, 0.15);
            transform: translateY(-2px) scale(1.02);
        }
        .input-box input:focus::placeholder { color: #00d4ff; opacity: 0.6; transform: translateX(5px); }

        .eye-icon {
            position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
            cursor: pointer; color: #606070; font-size: 18px; user-select: none; transition: color 0.3s;
        }
        .eye-icon:hover { color: #00d4ff; }
        .eye-icon.active { color: #00d4ff; }

        .otp-input {
            text-align: center; letter-spacing: 3px; font-size: 15px;
        }
        .otp-input::placeholder { letter-spacing: 0; font-size: 13px; }

        .btn {
            background: linear-gradient(135deg, #00d4ff 0%, #0f3460 100%); background-size: 200% 200%;
            color: white; border: none; padding: 14px 30px; border-radius: 10px; font-size: 15px;
            cursor: pointer; font-weight: 700; width: 100%; text-transform: uppercase; letter-spacing: 1px;
            transition: all 0.3s; text-align: center; display: block;
            animation: slideInUp 0.5s ease-out 0.5s both;
        }
        .btn:hover { transform: translateY(-3px); box-shadow: 0 10px 30px rgba(0, 212, 255, 0.4); background-position: 100% 100%; }

        .nav-link {
            display: block; text-align: center; margin-top: 20px; color: #a0a0b0;
            text-decoration: none; font-size: 14px; font-weight: 600; padding: 10px 20px;
            border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 8px; transition: all 0.3s;
            animation: slideInUp 0.5s ease-out 0.6s both;
        }
        .nav-link:hover { color: #00d4ff; border-color: rgba(0, 212, 255, 0.3); background: rgba(0, 212, 255, 0.05); transform: translateX(-3px); }

        .messages { margin-bottom: 20px; }
        .messages p { padding: 10px 20px; border-radius: 8px; margin-bottom: 5px; font-size: 13px; font-weight: 500; text-align: center; animation: fadeInScale 0.4s ease-out; }
        .messages .success { background: rgba(40, 167, 69, 0.15); color: #50d870; border: 1px solid rgba(40, 167, 69, 0.3); }
        .messages .error { background: rgba(220, 53, 69, 0.15); color: #ff6b6b; border: 1px solid rgba(220, 53, 69, 0.3); }
    </style>
</head>
<body>

    <div class="particles">
        <div class="particle"></div><div class="particle"></div><div class="particle"></div>
        <div class="particle"></div><div class="particle"></div><div class="particle"></div>
    </div>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <div class="card">

        {% if messages %}
        <div class="messages">
            {% for message in messages %}
            <p class="{{ message.tags }}">{{ message }}</p>
            {% endfor %}
        </div>
        {% endif %}

        {% if step == 'send' %}
        <h1>Forgot Password</h1>
        <p class="subtitle">Enter your email to receive OTP</p>
        <form method="POST">
            {% csrf_token %}
            <input type="hidden" name="step" value="send">
            <div class="input-box">
                <input type="email" name="email" placeholder="Enter your Email (Gmail)" required>
            </div>
            <button type="submit" class="btn">Send OTP</button>
        </form>
        {% else %}
        <h1>Reset Password</h1>
        <p class="subtitle">Enter OTP and new password</p>
        <form method="POST">
            {% csrf_token %}
            <input type="hidden" name="step" value="reset">
            <input type="hidden" name="email" value="{{ email }}">
            <div class="input-box">
                <input type="text" name="otp" class="otp-input" placeholder="Enter OTP" maxlength="6" required>
            </div>
            <div class="input-box">
                <input type="password" name="new_password" id="new-pass" placeholder="New Password" required>
                <span class="eye-icon" onclick="togglePass('new-pass', this)">&#128065;</span>
            </div>
            <button type="submit" class="btn">Reset Password</button>
        </form>
        {% endif %}

        <a href="{% url 'auth' %}" class="nav-link">&#8592; Back to Login</a>
    </div>

    <script>
        function togglePass(id, icon) {
            var input = document.getElementById(id);
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.add('active');
            } else {
                input.type = 'password';
                icon.classList.remove('active');
            }
        }
    </script>

</body>
</html>
