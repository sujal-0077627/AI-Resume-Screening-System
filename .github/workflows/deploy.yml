name: Sync to Hugging Face Space (Optional)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    if: "${{ secrets.HF_TOKEN != '' }}"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_REPO: ${{ secrets.HF_SPACE_REPO }}
        run: |
          git push --force https://oauth2:$HF_TOKEN@huggingface.co/spaces/$HF_SPACE_REPO HEAD:refs/heads/main
