services:
  # PostgreSQL database
  db:
    image: postgres:16-alpine
    container_name: ai-resume-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_resume}
      POSTGRES_USER: ${POSTGRES_USER:-resume_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-resume_password_2024}
    ports:
      - "5432:5432"   # optional: external access for tools like pgAdmin
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-resume_user} -d ${POSTGRES_DB:-ai_resume}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Django web application
  web:
    build: .
    container_name: ai-resume-screening
    ports:
      - "8000:8000"
    volumes:
      - ./media:/app/media   # uploaded resumes persist on host
    env_file:
      - .env
    environment:
      
      DATABASE_URL: postgres://${POSTGRES_USER:-resume_user}:${POSTGRES_PASSWORD:-resume_password_2024}@db:5432/${POSTGRES_DB:-ai_resume}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  # Persistent Postgres data 
  postgres_data:
